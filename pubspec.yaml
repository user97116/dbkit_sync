name: dbkit_sync
description: >-
  Offline-first sync for dbkit: outbox + pull engine with pluggable backends
  for Firebase (Firestore), Supabase, REST, or any custom server.
version: 0.1.2
repository: https://github.com/user97116/dbkit_sync
issue_tracker: https://github.com/user97116/dbkit_sync/issues
homepage: https://github.com/user97116/dbkit_sync

environment:
  sdk: ^3.0.0

dependencies:
  dbkit: ^0.4.1
  http: ^1.6.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0

topics:
  - sqlite
  - sync
  - offline-first
  - firebase
  - supabase
